<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KasKu — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafaf8;
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 1.5rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0a0a0a; color: #ededed; }
      .card { background: #141414; border-color: rgba(255,255,255,0.1); }
      .badge { background: rgba(16,185,129,0.15); }
    }
    .card {
      max-width: 360px;
      width: 100%;
      background: #fff;
      border: 1px solid #e8e8e4;
      border-radius: 1.25rem;
      padding: 2rem 1.75rem;
      text-align: center;
      box-shadow: 0 8px 32px -8px rgba(0,0,0,0.08);
    }
    .icon-wrap {
      width: 64px; height: 64px;
      background: rgba(16,185,129,0.1);
      border-radius: 1rem;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.25rem;
    }
    .icon-wrap svg { width: 32px; height: 32px; color: #10b981; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { font-size: 0.875rem; color: #666; line-height: 1.6; margin-bottom: 1.5rem; }
    .badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: rgba(16,185,129,0.1); color: #10b981;
      font-size: 0.75rem; font-weight: 600;
      padding: 0.35rem 0.85rem; border-radius: 999px;
      margin-bottom: 1.5rem;
    }
    .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #10b981; }
    button {
      width: 100%; padding: 0.75rem;
      background: #10b981; color: #fff;
      border: none; border-radius: 0.75rem;
      font-size: 0.875rem; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
        <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <div class="badge">Tidak ada koneksi</div>
    <h1>Kamu sedang offline</h1>
    <p>Periksa koneksi internet kamu, lalu coba lagi untuk mengakses KasKu.</p>
    <button onclick="window.location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
